name: Deploy Pipeline AWS EB

on:
  push:
    branches:
      - fix/bugs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

    build:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
            with:
             fetch-depth: 0
          - uses: pnpm/action-setup@v2
            with:
              version: latest
          - uses: actions/setup-node@v4
            with:
             cache: 'pnpm'
             node-version: 23
          - name: Install dependencies
            run: pnpm install --frozen-lockfile
          - name: Build NestJS application
            run: pnpm --filter warehouse-server build
          - uses: actions/upload-artifact@v4
            with:
              name: dist
              path: backend/warehouse-server/dist
          - uses: actions/upload-artifact@v4
            with:
              name: package-json
              path: backend/warehouse-server/package.json


    deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Source
          uses: actions/checkout@v4
        - uses: pnpm/action-setup@v2
          with:
            version: latest
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            cache: 'pnpm'
            node-version: 23
        - name: Install production dependencies
          working-directory: backend/warehouse-server
          run: pnpm install --frozen-lockfile --prod
        - name: Download artifact dist
          uses: actions/download-artifact@v4
          with:
            name: dist
            path: backend/warehouse-server/dist
        - name: Download artifact package.json
          uses: actions/download-artifact@v4
          with:
            name: package-json
            path: backend/warehouse-server

        - name: Verify working directory and files
          working-directory: backend/warehouse-server
          run: |
            echo "Current working directory: $(pwd)"
            echo "Expected: backend/warehouse-server"
            echo ""
            echo "Checking required files exist:"
            ls -la dist/ | head -5 || echo "❌ dist/ not found"
            ls -la node_modules/ | head -5 || echo "❌ node_modules/ not found"
            test -f package.json && echo "✅ package.json exists" || echo "❌ package.json not found"
            test -f Procfile && echo "✅ Procfile exists" || echo "❌ Procfile not found"
            test -d .platform && echo "✅ .platform/ exists" || echo "❌ .platform/ not found"
            test -d .elasticbeanstalk && echo "✅ .elasticbeanstalk/ exists" || echo "❌ .elasticbeanstalk/ not found"
            echo ""
            echo "Directory structure:"
            ls -la

        - name: Create deployment package
          working-directory: backend/warehouse-server
          run: |
            # Include only necessary files for deployment
            zip -r ../../nodejs-app-build.zip \
              dist \
              node_modules \
              package.json \
              Procfile \
              .platform \
              .elasticbeanstalk \
              -x "*.git*" \
              -x "*node_modules/.cache*" \
              -x "*.map"

        - name: Verify zip contents
          run: |
            echo "Zip file location: $(pwd)/nodejs-app-build.zip"
            echo "Zip file size: $(du -h nodejs-app-build.zip | cut -f1)"
            echo ""
            echo "Contents of zip file:"
            unzip -l nodejs-app-build.zip | head -30
            echo ""
            echo "Checking for key files in zip:"
            unzip -l nodejs-app-build.zip | grep -E "(package.json|Procfile|dist/main.js|\.platform)" || echo "⚠️  Some expected files not found"

        - name: Deploy to Elastic Beanstalk
          uses: einaregilsson/beanstalk-deploy@v21
          with:
            aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
            aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            application_name: 'palakart-api'
            environment_name: 'Palakart-api-env'
            region: ap-south-1
            version_label: "deploy-${{ github.run_id }}"
            deployment_package: nodejs-app-build.zip
            use_existing_version_if_available: true
      