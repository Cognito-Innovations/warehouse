name: Deploy Pipeline AWS EB

on:
  push:
    branches:
      - fix/bugs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/warehouse-server

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NestJS application
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: backend/warehouse-server

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: backend/warehouse-server

      - name: Create deployment package
        working-directory: backend/warehouse-server
        run: |
          zip -r ../../nodejs-app-build.zip \
            dist \
            node_modules \
            package.json \
            Procfile \
            -x "*.git*" -x "*node_modules/.cache*" -x "*.map"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: 'palakart-api'
          environment_name: 'Palakart-api-env'
          region: ap-south-1
          version_label: "deploy-${{ github.run_id }}"
          deployment_package: nodejs-app-build.zip
          use_existing_version_if_available: true