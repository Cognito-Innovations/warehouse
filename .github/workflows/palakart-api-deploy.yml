name: Deploy Pipeline AWS EB

on:
  push:
    branches:
      - fix/bugs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

    build:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
            with:
             fetch-depth: 0
          - uses: pnpm/action-setup@v4
            with:
              version: 9
          - uses: actions/setup-node@v4
            with:
             cache: 'pnpm'
             node-version: 22
          - name: Install dependencies
            run: pnpm install --frozen-lockfile
          - name: Build
            working-directory: backend/warehouse-server
            run: pnpm run build
          - uses: actions/upload-artifact@v4
            with:
              name: dist
              path: backend/warehouse-server/dist


    deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Source
          uses: actions/checkout@v4
        - uses: pnpm/action-setup@v4
          with:
            version: 9
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            cache: 'pnpm'
            node-version: 22
        - name: Install dependencies
          working-directory: backend/warehouse-server
          run: pnpm install --frozen-lockfile
        - name: Download artifact dist
          uses: actions/download-artifact@v4
          with:
            name: dist
            path: backend/warehouse-server/dist
        - name: Zip application
          working-directory: backend/warehouse-server
          run: zip -r ../../nodejs-app-build.zip dist package.json pnpm-lock.yaml node_modules
        - name: Deploy to Elastic Beanstalk
          uses: einaregilsson/beanstalk-deploy@v21
          with:
            aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
            aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            application_name: 'palakart-api'
            environment_name: 'Palakart-api-env'
            region: ap-south-1
            version_label: "deploy-${{ github.run_id }}"
            deployment_package: nodejs-app-build.zip
            use_existing_version_if_available: true